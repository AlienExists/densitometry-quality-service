services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - '8080:80'
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      QC_WEIGHTS_DIR: /app/qc/weights
    volumes:
      - ../qc/weights:/app/qc/weights:ro
    ports:
      - '8000:8000'
    restart: unless-stopped
