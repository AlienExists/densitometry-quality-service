server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Кэширование статики (JS/CSS/шрифты/картинки) — раздел 3.2 ТЗ
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Проксирование запросов к backend, чтобы фронт и API были на одном
    # origin (без CORS-проблем) при работе через docker-compose.
    # Имя "backend" — сервис из docker-compose.yml, поменяйте на реальное.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # анализ DICOM может занимать время
        client_max_body_size 250M; # под загрузку DICOM/ZIP
    }

    # SPA-роутинг: любые прочие пути отдаём на index.html, чтобы работал
    # React Router на прямых ссылках типа /viewer, /results
    location / {
        try_files $uri $uri/ /index.html;
    }
}
